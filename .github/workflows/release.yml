name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Restore NuGet packages
        run: nuget restore "LazyCRC-Shell-Extension.slnx"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build
        run: msbuild "LazyCRC-Shell-Extension/LazyCRC-Shell-Extension.csproj" /p:Configuration=Release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lazy_crc_shell
          path: LazyCRC-Shell-Extension/bin/Release/lazy_crc_shell.zip

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: README.md
          files: LazyCRC-Shell-Extension/bin/Release/lazy_crc_shell.zip
